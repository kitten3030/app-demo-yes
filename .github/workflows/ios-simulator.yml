# GitHub Actions：在 macOS runner 建置 iOS 模擬器版，啟動 iPhone 模擬器、安裝並開啟 App、截圖。
# 不需要 Apple 帳號、憑證或任何 Secrets（模擬器版不用簽署）。
#
# 產出（Artifacts）：
#   ios-simulator-screenshot   啟動後的截圖（PNG）
#   ios-simulator-app          Runner.app（zip，可在有 Xcode 的 Mac 用 simctl install 安裝）
#
# 限制：無頭執行，只能看啟動後畫面與日誌，無法互動；相機、麥克風、推播模擬器本來就測不到。
name: iOS simulator

on:
  workflow_dispatch:   # Actions → iOS simulator → Run workflow

env:
  BUNDLE_ID: tw.com.pst.yesAppDemo

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: 建置模擬器版
        run: |
          flutter build ios --simulator --debug
          test -d build/ios/iphonesimulator/Runner.app

      - name: 選擇並啟動 iPhone 模擬器
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          UDID="$(python3 - "$RUNNER_TEMP/devices.json" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1]))["devices"]
          def ver(rt):
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              return (int(m.group(1)), int(m.group(2))) if m else None
          runtimes = sorted((r for r in data if ver(r)), key=ver)
          for rt in reversed(runtimes):
              for d in data[rt]:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      print(d["udid"]); sys.exit(0)
          sys.exit("找不到可用的 iPhone 模擬器")
          PY
          )"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID" || true
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: 安裝並開啟 App
        run: |
          set -euo pipefail
          xcrun simctl install "$SIM_UDID" build/ios/iphonesimulator/Runner.app
          # 預先允許權限，避免系統權限對話框蓋住畫面
          xcrun simctl privacy "$SIM_UDID" grant all "$BUNDLE_ID" || true
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          sleep 15
          # App 若啟動後崩潰，process 不會留在 launchctl 清單中
          if ! xcrun simctl spawn "$SIM_UDID" launchctl list | grep -q "$BUNDLE_ID"; then
            echo "::error::App 啟動後已結束（可能崩潰）"
            exit 1
          fi

      - name: 截圖
        if: always()
        run: |
          mkdir -p build/sim-out
          xcrun simctl io "$SIM_UDID" screenshot build/sim-out/launch.png

      - name: 封裝 Runner.app
        if: always()
        run: |
          ditto -c -k --keepParent build/ios/iphonesimulator/Runner.app build/sim-out/Runner-simulator.app.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshot
          path: build/sim-out/launch.png
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-app
          path: build/sim-out/Runner-simulator.app.zip
          if-no-files-found: warn
