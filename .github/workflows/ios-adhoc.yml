# GitHub Actions：打包 iOS ad-hoc IPA（供 app-install-page 以 itms-services 安裝）
#
# 需要在 GitHub 儲存庫設定 3 個 Secrets（步驟見 app-install-page/README.md
# 的「iOS（GitHub Actions 雲端打包）」）：
#   IOS_CERT_P12_BASE64   Apple Distribution 憑證 .p12 的 base64
#   IOS_CERT_PASSWORD     匯出 .p12 時設定的密碼
#   IOS_PROFILE_BASE64    ad-hoc 描述檔 .mobileprovision 的 base64
#
# 憑證匯入、手動簽署、ExportOptions.plist 產生在 .github/actions/ios-signing。
name: iOS ad-hoc IPA

on:
  workflow_dispatch:   # 只手動觸發：Actions → iOS ad-hoc IPA → Run workflow

env:
  BUNDLE_ID: tw.com.pst.yesAppDemo

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: iOS 簽署設定
        uses: ./.github/actions/ios-signing
        with:
          cert-p12-base64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          cert-password: ${{ secrets.IOS_CERT_PASSWORD }}
          profile-base64: ${{ secrets.IOS_PROFILE_BASE64 }}
          bundle-id: ${{ env.BUNDLE_ID }}
          export-method: ad-hoc

      - run: flutter pub get

      - name: 打包 ad-hoc IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: 清除鑰匙圈
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
