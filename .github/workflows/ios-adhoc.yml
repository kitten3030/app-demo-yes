# GitHub Actions：打包 iOS ad-hoc IPA（供 app-install-page 以 itms-services 安裝）
#
# 需要在 GitHub 儲存庫設定 3 個 Secrets（步驟見 app-install-page/README.md
# 的「iOS（GitHub Actions 雲端打包）」）：
#   IOS_CERT_P12_BASE64   Apple Distribution 憑證 .p12 的 base64
#   IOS_CERT_PASSWORD     匯出 .p12 時設定的密碼
#   IOS_PROFILE_BASE64    ad-hoc 描述檔 .mobileprovision 的 base64
name: iOS ad-hoc IPA

on:
  workflow_dispatch:   # 只手動觸發：Actions → iOS ad-hoc IPA → Run workflow

env:
  BUNDLE_ID: tw.com.pst.yesAppDemo

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 匯入憑證與描述檔
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          CERT_NAME="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(.*\)"/\1/p' | head -1)"

          {
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "TEAM_ID=$TEAM_ID"
            echo "CERT_NAME=$CERT_NAME"
          } >> "$GITHUB_ENV"

      - name: 將 Runner 改成手動簽署
        run: |
          set -euo pipefail
          gem install xcodeproj --no-document
          ruby <<RUBY
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |t| t.name == 'Runner' }
          target.build_configurations.each do |c|
            next unless c.name == 'Release'
            c.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            c.build_settings['DEVELOPMENT_TEAM'] = ENV['TEAM_ID']
            c.build_settings['CODE_SIGN_IDENTITY'] = ENV['CERT_NAME']
            c.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV['PROFILE_NAME']
          end
          project.save
          RUBY

      - name: 產生 ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>${CERT_NAME}</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          PLIST

      - run: flutter pub get

      - name: 打包 ad-hoc IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: 清除鑰匙圈
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
