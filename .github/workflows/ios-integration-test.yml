# GitHub Actions：在 macOS runner 的 iPhone 模擬器上跑 Flutter integration test，並把每個關鍵畫面截圖。
# 不需要 Apple 帳號、憑證或任何 Secrets。測試內容見 integration_test/app_test.dart。
#
# 產出（Artifacts）：
#   integration-screenshots   測試過程中的截圖（build/integration_screenshots/*.png）
#   integration-log           flutter drive 的完整輸出
name: iOS integration test

on:
  workflow_dispatch:   # Actions → iOS integration test → Run workflow

jobs:
  integration:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: 選擇並啟動 iPhone 模擬器
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          UDID="$(python3 - "$RUNNER_TEMP/devices.json" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1]))["devices"]
          def ver(rt):
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              return (int(m.group(1)), int(m.group(2))) if m else None
          runtimes = sorted((r for r in data if ver(r)), key=ver)
          for rt in reversed(runtimes):
              for d in data[rt]:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      print(d["udid"]); sys.exit(0)
          sys.exit("找不到可用的 iPhone 模擬器")
          PY
          )"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: 執行 integration test
        run: |
          set -o pipefail
          mkdir -p build
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_test.dart \
            -d "$SIM_UDID" --no-pub 2>&1 | tee build/integration.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-screenshots
          path: build/integration_screenshots/*.png
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-log
          path: build/integration.log
          if-no-files-found: warn
