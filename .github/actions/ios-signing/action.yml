# Composite action：iOS 簽署前置作業（目前由 ios-adhoc.yml 使用）
#   1. 匯入 Distribution 憑證與描述檔到臨時鑰匙圈
#   2. 把 ios/Runner.xcodeproj 的 Release 改成手動簽署
#   3. 產生 ios/ExportOptions.plist
#
# 執行後會寫入環境變數 PROFILE_NAME / TEAM_ID / CERT_NAME 給後續步驟使用。
# 呼叫前必須先 checkout。鑰匙圈（$RUNNER_TEMP/build.keychain-db）要由呼叫端在最後清除。
name: iOS signing
description: 匯入憑證與描述檔、設定手動簽署、產生 ExportOptions.plist

inputs:
  cert-p12-base64:
    description: Apple Distribution 憑證 .p12 的 base64
    required: true
  cert-password:
    description: .p12 密碼
    required: true
  profile-base64:
    description: 描述檔 .mobileprovision 的 base64（類型要與 export-method 相符）
    required: true
  bundle-id:
    description: App 的 Bundle ID
    required: true
  export-method:
    description: ExportOptions 的 method，例如 ad-hoc 或 app-store-connect
    required: true

runs:
  using: composite
  steps:
    - name: 匯入憑證與描述檔
      shell: bash
      env:
        IOS_CERT_P12_BASE64: ${{ inputs.cert-p12-base64 }}
        IOS_CERT_PASSWORD: ${{ inputs.cert-password }}
        IOS_PROFILE_BASE64: ${{ inputs.profile-base64 }}
      run: |
        set -euo pipefail
        KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
        KEYCHAIN_PASSWORD="$(uuidgen)"

        echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERT_PASSWORD" \
          -A -t cert -f pkcs12 -k "$KEYCHAIN"
        security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

        echo "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
        security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
        PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
        PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
        TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
        mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
        cp "$RUNNER_TEMP/profile.mobileprovision" \
          "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

        # 只取 Apple Distribution 憑證，避免 .p12 內有 Development 憑證時選錯
        CERT_NAME="$(security find-identity -v -p codesigning "$KEYCHAIN" \
          | grep 'Apple Distribution' | sed -n 's/.*"\(.*\)"/\1/p' | head -1 || true)"
        if [ -z "$CERT_NAME" ]; then
          echo "::error::.p12 內找不到 Apple Distribution 憑證"
          exit 1
        fi

        {
          echo "PROFILE_NAME=$PROFILE_NAME"
          echo "TEAM_ID=$TEAM_ID"
          echo "CERT_NAME=$CERT_NAME"
        } >> "$GITHUB_ENV"

    - name: 將 Runner 改成手動簽署
      shell: bash
      run: |
        set -euo pipefail
        gem install xcodeproj --no-document
        ruby <<RUBY
        require 'xcodeproj'
        project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
        target = project.targets.find { |t| t.name == 'Runner' }
        target.build_configurations.each do |c|
          next unless c.name == 'Release'
          c.build_settings['CODE_SIGN_STYLE'] = 'Manual'
          c.build_settings['DEVELOPMENT_TEAM'] = ENV['TEAM_ID']
          c.build_settings['CODE_SIGN_IDENTITY'] = ENV['CERT_NAME']
          c.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV['PROFILE_NAME']
        end
        project.save
        RUBY

    - name: 產生 ExportOptions.plist
      shell: bash
      env:
        BUNDLE_ID: ${{ inputs.bundle-id }}
        EXPORT_METHOD: ${{ inputs.export-method }}
      run: |
        set -euo pipefail
        # 名稱可能含 & < > " '（例如描述檔叫 "yes & app"），寫進 XML 前要跳脫
        xml_escape() {
          printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' \
            -e 's/"/\&quot;/g' -e "s/'/\&apos;/g"
        }
        X_METHOD="$(xml_escape "$EXPORT_METHOD")"
        X_TEAM="$(xml_escape "$TEAM_ID")"
        X_CERT="$(xml_escape "$CERT_NAME")"
        X_BUNDLE="$(xml_escape "$BUNDLE_ID")"
        X_PROFILE="$(xml_escape "$PROFILE_NAME")"

        EXTRA=""
        if [ "$EXPORT_METHOD" = "app-store-connect" ]; then
          EXTRA="<key>uploadSymbols</key><true/>"
        fi
        cat > ios/ExportOptions.plist <<PLIST
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key><string>${X_METHOD}</string>
          <key>teamID</key><string>${X_TEAM}</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>${X_CERT}</string>
          <key>provisioningProfiles</key>
          <dict><key>${X_BUNDLE}</key><string>${X_PROFILE}</string></dict>
          ${EXTRA}
        </dict>
        </plist>
        PLIST
