# Codemagic：打包 iOS ad-hoc IPA（供 app-install-page 以 itms-services 安裝）
#
# 事前設定（只做一次）請見 app-install-page/README.md 的「iOS（Codemagic 雲端打包）」。
#   1. Codemagic → Teams → Personal Account / Team integrations → Developer Portal
#      → 新增 App Store Connect API key，名稱設為 `codemagic`（對應下面的 integrations）
#   2. Apple Developer 網站先註冊測試 iPhone 的 UDID（ad-hoc 描述檔只包含已註冊裝置）
#   3. 在 Apple Developer 建立 App ID：tw.com.pst.yesAppDemo
workflows:
  ios-adhoc:
    name: iOS ad-hoc IPA
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: codemagic   # 要和 Codemagic 上 API key 的名稱一致

    environment:
      # Codemagic 會用 API key 自動建立/下載 ad-hoc 憑證與描述檔，
      # 並寫入環境變數供 `xcode-project use-profiles` 使用。
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: tw.com.pst.yesAppDemo
      flutter: stable
      xcode: latest
      cocoapods: default

    # 目前儲存庫在內網 GitLab（192.168.5.9），Codemagic 雲端連不到；
    # 所以不設自動觸發，只在 Codemagic 介面手動 Start new build。
    triggering:
      events: []

    scripts:
      - name: 取得 Flutter 套件
        script: flutter packages pub get

      - name: 安裝 CocoaPods 相依
        script: |
          cd ios
          pod install

      - name: 套用簽署設定到 Xcode 專案
        script: xcode-project use-profiles

      - name: 打包 ad-hoc IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
